# Shared Taskfile for Tauri v2 projects
# Required variables: ARTIFACT_NAME
# Optional variables: BINARY_NAME (default: ARTIFACT_NAME), FRONTEND_CMD

version: '3'

includes:
  helpers:
    taskfile: Taskfile.helpers.yaml

tasks:
  dev:
    desc: "Run in development mode (single terminal, may cause TTY issues on Fedora)"
    env:
      TERM: dumb
      NO_COLOR: "1"
    cmd: cargo tauri dev

  dev-frontend:
    desc: "Run frontend dev server only"
    cmd: '{{.FRONTEND_CMD | default "bun run start"}}'

  dev-tauri:
    desc: "Run Tauri backend only (expects frontend already running)"
    env:
      TERM: dumb
      NO_COLOR: "1"
    cmd: cargo tauri dev --no-dev-server

  build:
    desc: "Build release binary (no bundles)"
    cmd: cargo tauri build --no-bundle

  bundle:
    desc: "Build release binary with platform bundles (deb, AppImage, etc.)"
    cmd: cargo tauri build

  build-frontend:
    desc: "Build frontend only"
    cmd: '{{.BUILD_FRONTEND_CMD | default "bun run build"}}'

  test:
    desc: "Run frontend tests"
    cmd: '{{.TEST_CMD | default "bun run test"}}'

  test-rust:
    desc: "Run Rust backend tests"
    cmd: cargo test
    dir: src-tauri

  clean:
    desc: "Clean build artifacts"
    cmds:
      - task: helpers:delete-paths
        vars:
          PATHS: "dist src-tauri/target"

  install:
    desc: "Build and install to ~/.local/bin"
    deps:
      - build
    vars:
      BIN_NAME: '{{.BINARY_NAME | default .ARTIFACT_NAME}}'
    cmds:
      - mkdir -p {{.HOME}}/.local/bin
      - cp src-tauri/target/release/{{.BIN_NAME}} {{.HOME}}/.local/bin/{{.ARTIFACT_NAME}}
      - |
        mkdir -p {{.HOME}}/.local/share/icons/hicolor/128x128/apps
        cp src-tauri/icons/128x128.png {{.HOME}}/.local/share/icons/hicolor/128x128/apps/{{.ARTIFACT_NAME}}.png
      - |
        mkdir -p {{.HOME}}/.local/share/applications
        cat > {{.HOME}}/.local/share/applications/{{.ARTIFACT_NAME}}.desktop << EOF
        [Desktop Entry]
        Type=Application
        Name={{.DISPLAY_NAME | default .ARTIFACT_NAME}}
        Comment={{.DESCRIPTION | default "A Tauri application"}}
        Exec={{.HOME}}/.local/bin/{{.ARTIFACT_NAME}}
        Icon={{.ARTIFACT_NAME}}
        Terminal=false
        Categories={{.CATEGORIES | default "Utility"}}
        StartupWMClass={{.ARTIFACT_NAME}}
        EOF
      - echo "Installed {{.ARTIFACT_NAME}} to ~/.local/bin"

  autostart:
    desc: "Add application to startup applications"
    cmds:
      - mkdir -p {{.HOME}}/.config/autostart
      - |
        cat > {{.HOME}}/.config/autostart/{{.ARTIFACT_NAME}}.desktop << EOF
        [Desktop Entry]
        Type=Application
        Name={{.DISPLAY_NAME | default .ARTIFACT_NAME}}
        Exec={{.HOME}}/.local/bin/{{.ARTIFACT_NAME}}
        Icon={{.ARTIFACT_NAME}}
        X-GNOME-Autostart-enabled=true
        EOF
      - echo "Added {{.ARTIFACT_NAME}} to autostart"

  uninstall:
    desc: "Remove installed binary, desktop entry, and autostart"
    cmds:
      - rm -f {{.HOME}}/.local/bin/{{.ARTIFACT_NAME}}
      - rm -f {{.HOME}}/.local/share/applications/{{.ARTIFACT_NAME}}.desktop
      - rm -f {{.HOME}}/.local/share/icons/hicolor/128x128/apps/{{.ARTIFACT_NAME}}.png
      - rm -f {{.HOME}}/.config/autostart/{{.ARTIFACT_NAME}}.desktop
      - echo "Uninstalled {{.ARTIFACT_NAME}}"
